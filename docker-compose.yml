services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: bench_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: bench_rag_app
    volumes:
      - ./:/app
    environment:
      - PYTHONPATH=/app/src
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_TIMEOUT=${QDRANT_TIMEOUT:-60.0}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-key}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - GENERATOR_BASE_URL=${GENERATOR_BASE_URL:-}
      - GENERATOR_API_KEY=${GENERATOR_API_KEY:-}
      - GENERATOR_MODEL=${GENERATOR_MODEL:-gpt-4o-mini}
      - GENERATOR_MAX_TOKENS=${GENERATOR_MAX_TOKENS:-8192}
      - GENERATOR_TEMPERATURE=${GENERATOR_TEMPERATURE:-0.0}
      - GENERATOR_ENABLE_THINKING=${GENERATOR_ENABLE_THINKING:-}
      - GENERATOR_DIALECT=${GENERATOR_DIALECT:-auto}
      - JUDGE_BASE_URL=${JUDGE_BASE_URL:-}
      - JUDGE_API_KEY=${JUDGE_API_KEY:-}
      - JUDGE_MODEL=${JUDGE_MODEL:-gpt-4o-mini}
      - JUDGE_MAX_TOKENS=${JUDGE_MAX_TOKENS:-2048}
      - JUDGE_ENABLE_THINKING=${JUDGE_ENABLE_THINKING:-}
      - JUDGE_DIALECT=${JUDGE_DIALECT:-auto}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1536}
      - EMBEDDING_QUERY_PREFIX=${EMBEDDING_QUERY_PREFIX:-}
      - EMBEDDING_DOCUMENT_PREFIX=${EMBEDDING_DOCUMENT_PREFIX:-}
      - RERANKER_BASE_URL=${RERANKER_BASE_URL:-}
      - RERANKER_API_KEY=${RERANKER_API_KEY:-}
      - RERANKER_MODEL=${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      - GENERATOR_TIMEOUT=${GENERATOR_TIMEOUT:-180.0}
      - JUDGE_TIMEOUT=${JUDGE_TIMEOUT:-180.0}
      - EMBEDDING_TIMEOUT=${EMBEDDING_TIMEOUT:-60.0}
      - RERANKER_TIMEOUT=${RERANKER_TIMEOUT:-120.0}
      - HTTP_MAX_RETRIES=${HTTP_MAX_RETRIES:-3}
      - HTTP_RETRY_BACKOFF=${HTTP_RETRY_BACKOFF:-2.0}
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["pytest", "-v"]

volumes:
  qdrant_storage:
